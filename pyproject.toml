[project]
name = "sqlalchemy-better-aurora-data-api"
version = "0.1.0a1"
description = "An AWS Aurora Serverless Data API dialect for SQLAlchemy"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [
    { name = "juanjodevio" },
]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "aurora-data-api>=0.5.0",
    "sqlalchemy",
]

[project.urls]
Homepage = "https://github.com/juanjodevio/sqlalchemy-better-aurora-data-api"
Repository = "https://github.com/juanjodevio/sqlalchemy-better-aurora-data-api"
Changelog = "https://github.com/juanjodevio/sqlalchemy-better-aurora-data-api/blob/main/CHANGES.md"
Origin = "https://github.com/chanzuckerberg/sqlalchemy-aurora-data-api"

[project.entry-points."sqlalchemy.dialects"]
"mysql.auroradataapi" = "sqlalchemy_better_aurora_data_api:AuroraMySQLDataAPIDialect"
"postgresql.auroradataapi" = "sqlalchemy_better_aurora_data_api:AuroraPostgresDataAPIDialect"

[dependency-groups]
dev = ["ruff==0.1.9"]
docs = [
    "guzzle-sphinx-theme",
    "myst-parser",
    "sphinx",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sqlalchemy_better_aurora_data_api"]

[tool.ruff]
line-length = 120

[tool.ruff.per-file-ignores]
"sqlalchemy_better_aurora_data_api/__init__.py" = ["E401", "F401"]
